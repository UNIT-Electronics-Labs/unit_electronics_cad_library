<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enlaces a bibliotecas y modelos CAD de UNIT Electronics">
  <title>Enlaces CAD | UNIT Electronics</title>
</head>
<body>
  <header>
    <h1>UNIT Electronics — enlaces CAD</h1>
    <p>Huella, símbolo, STEP y GLB extraídos o vinculados desde las bibliotecas publicadas.</p>
    <p><a id="open-catalog" href="#">Abrir catalog.json</a></p>
  </header>
  <main>
    <p id="status" role="status">Cargando catálogo…</p>
    <label>
      Buscar componente
      <input id="search" type="search" autocomplete="off">
    </label>
    <section id="catalog" aria-live="polite"></section>
  </main>
  <template id="empty-template"><p>No hay componentes publicados todavía.</p></template>
  <script src="app.js" defer></script>
</body>
</html>
