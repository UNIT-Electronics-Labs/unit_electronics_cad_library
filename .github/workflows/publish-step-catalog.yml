name: Publicar catálogo STEP

on:
  push:
    branches: [main]
    paths:
      - '**.step'
      - '**.STEP'
      - '**.stp'
      - '**.STP'
      - '**.kicad_mod'
      - '**.KICAD_MOD'
      - '**.kicad_sym'
      - '**.KICAD_SYM'
      - 'tools/build_step_catalog.py'
      - 'requirements.txt'
      - '.github/workflows/publish-step-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar conversor CAD
        run: 'pip install --only-binary=:all: -r requirements.txt'
      - name: Instalar renderizador KiCad
        run: sudo apt-get update && sudo apt-get install --yes kicad
      - name: Convertir STEP a GLB y crear catálogo
        run: python tools/build_step_catalog.py --input . --output site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
