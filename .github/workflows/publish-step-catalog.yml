name: Publicar catálogo STEP

on:
  push:
    branches: [main]
    paths:
      - '**.step'
      - '**.STEP'
      - '**.stp'
      - '**.STP'
      - 'tools/build_step_catalog.py'
      - '.github/workflows/publish-step-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar conversor CAD
        run: 'pip install --only-binary=:all: cadquery==2.5.2 trimesh==4.4.9'
      - name: Convertir STEP a GLB y crear catálogo
        run: python tools/build_step_catalog.py --input . --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
